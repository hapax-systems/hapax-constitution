axiom_id: corporate_boundary
derived_at: '2026-03-05'
model: balanced
derivation_version: 1
implications:
- id: cb-llm-001
  tier: T0
  text: >-
    Components operating in an external institutional compartment must support
    direct API calls to compartment-sanctioned providers (OpenAI, Anthropic)
    without requiring a lab-local proxy. Proxy reachability is auto-detected
    by probing the local proxy health endpoint.
  enforcement: block
  canon: textualist
  mode: compatibility
  level: component

- id: cb-data-001
  tier: T0
  text: >-
    Cross-compartment artifact exchange must use only explicitly approved
    compartment remotes with zero cross-compartment credential, telemetry,
    sync-vault, or capture ingress. Components must never require direct
    network access to lab-local services for core functionality.
  enforcement: block
  canon: textualist
  mode: compatibility
  level: subsystem

- id: cb-degrade-001
  tier: T0
  text: >-
    Features depending on lab-local services (RAG search, health status,
    embedding) must fail silently with informative UI, not throw errors.
  enforcement: block
  canon: purposivist
  mode: sufficiency
  level: component

- id: cb-key-001
  tier: T0
  text: >-
    API credentials are resolved strictly within the active compartment from
    local editor settings, environment variables, or local secret store (in
    that order). Per-machine settings are never synced across compartments,
    and no secrets may be committed to any repository.
  enforcement: block
  canon: textualist
  mode: compatibility
  level: component

- id: cb-extensible-001
  tier: T1
  text: >-
    Adding a new sanctioned LLM provider must require only implementing a
    provider interface and adding a settings entry, not structural changes.
  enforcement: review
  canon: purposivist
  mode: sufficiency
  level: subsystem

- id: cb-parity-001
  tier: T2
  text: >-
    Core chat functionality (conversation, note context, slash commands)
    must work identically regardless of provider selection.
  enforcement: warn
  canon: purposivist
  mode: sufficiency
  level: component

- id: cb-scope-001
  tier: T1
  text: >
    corporate_boundary governs SYSTEM DATA FLOW across institutional
    compartments — compartment vaults, external institutional context,
    credentials, telemetry, and compartment-scoped artifacts. It does NOT
    govern deliberate operator-chosen research publication. Public research
    output published to public CDNs is deliberate publication, not a
    cross-compartment data leak, and is out of scope for corporate_boundary.
    Content that INCIDENTALLY captures external-compartment data (ambient
    audio capture from an external institutional session, screen capture of
    an external compartment surface) IS governed by corporate_boundary; the
    distinction is deliberate operator selection, not incidental exposure.
  enforcement: review
  canon: purposivist
  mode: sufficiency
  level: subsystem
  scope_clarification_date: '2026-04-16'
  scope_clarification_reason: >
    Pre-clarification, reading corporate_boundary as a blanket ban on all
    outbound artifact publication could be misinterpreted to block public
    research broadcasts. LRR Phase 6 codifies the boundary: deliberate public
    research publication is outside corporate_boundary; incidental
    cross-compartment data capture remains strictly prohibited.
