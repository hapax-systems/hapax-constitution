# Operator identity for repo-presentation render.
#
# This file ships a placeholder so CI can render against the registry
# deterministically. Production renders supply real values via either:
#
#   - `sdlc/operator.local.yaml` (gitignored; same schema; takes precedence)
#   - environment-variable overrides in render CLI (future)
#
# Schema:
#   full_name:      Operator's legal full name. Used ONLY in formal-address
#                   contexts: CITATION.cff `authors:`, codemeta.json
#                   `author:`, .zenodo.json `creators:`. Never in body text.
#   orcid:          ORCID iD URL (https://orcid.org/0000-...). Optional;
#                   omitted if null.
#   contact_url:    Public contact page for security disclosure. May carry
#                   a fragment naming the contact anchor. The page, not the
#                   fragment, is what a recheck fetches.
#   contact_email:  The network's public disclosure address (A16). It is not
#                   the principal's personal address. The practice of not
#                   publishing an address on repository surfaces comes from
#                   the "Operational checklist" of
#                   hapax-council/docs/research/2026-04-25-github-repo-presentation.md
#                   (agent-written research), not from the constitution; the
#                   seat's ruling does not apply it to the network's address.
#   omg_lol_address: weblog.lol subdomain prefix (default "hapax").
full_name: "<operator-name-unset>"
orcid: null
contact_url: "https://hapaxresearch.com/about/#contact"
contact_email: "hrl-han@hapaxresearch.com"
omg_lol_address: hapax
