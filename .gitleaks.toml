# Custom gitleaks rules for OpSec and infrastructure path hygiene
title = "Hapax Research Lab hygiene rules"

[[rules]]
id = "posix-home-directory-path"
description = "POSIX user home directory path literal"
regex = '''(?:/[h]ome/|~)[a-z_][a-z0-9_-]{0,31}/'''
tags = ["hygiene", "path"]
[rules.allowlist]
paths = ['''\.gitleaks\.toml''', '''tests/''']

[[rules]]
id = "tailscale-cgnat-ipv4"
description = "Private mesh RFC 6598 CGNAT IPv4 address"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["hygiene", "network"]
[rules.allowlist]
paths = ['''\.gitleaks\.toml''', '''tests/''']

# Allow known generated/vendor paths
[allowlist]
paths = ['''\.gitleaksignore''', '''node_modules/''', '''\.venv/''']
